[project]
name = "deskhelm-local-voice-runtime"
version = "0.1.0"
description = "Pinned optional CPU runtime for DeskHelm local voice research"
requires-python = "==3.12.*"
dependencies = [
  "deskhelm",
  "funasr==1.3.21",
  "g2pw==0.1.1",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "kokoro==0.9.4",
  "misaki[zh]==0.9.4",
  "numpy==2.5.2",
  "onnxruntime==1.29.0",
  "piper-tts==1.7.0",
  "sentence-stream==1.3.0",
  "sherpa-onnx==1.13.6",
  "torch==2.11.0+cpu",
  "torchaudio==2.11.0+cpu",
  "unicode-rbnf==2.4.0",
  "webrtcvad-wheels==2.0.14",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# The checkout itself, so the voice host and tests import it without PYTHONPATH.
deskhelm = { path = "../..", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

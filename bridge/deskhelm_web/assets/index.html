<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>DeskHelm</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="会话">
      <div class="sidebar-head">
        <div class="brand">
          <img src="/assets/icon.svg" alt="" width="22" height="22">
          <span>DeskHelm</span>
        </div>
        <button type="button" class="icon-button only-narrow" id="close-sidebar" aria-label="关闭会话列表">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
        </button>
      </div>
      <label class="search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13Z"></path><path d="m15.5 15.5 4.5 4.5"></path></svg>
        <span class="visually-hidden">搜索会话</span>
        <input id="search" type="search" placeholder="搜索会话" autocomplete="off" spellcheck="false">
      </label>
      <nav class="session-list" id="session-list" aria-label="会话列表"></nav>
      <footer class="sidebar-foot">
        <span class="connection" id="connection"></span>
        <button type="button" class="icon-button" id="theme-toggle">
          <svg class="icon theme-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"></path></svg>
          <svg class="icon theme-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path><path d="M12 2.5v2"></path><path d="M12 19.5v2"></path><path d="M2.5 12h2"></path><path d="M19.5 12h2"></path><path d="m5.3 5.3 1.4 1.4"></path><path d="m17.3 17.3 1.4 1.4"></path><path d="m5.3 18.7 1.4-1.4"></path><path d="m17.3 6.7 1.4-1.4"></path></svg>
        </button>
      </footer>
    </aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <div class="banner" id="banner" role="status" hidden></div>
      <div class="stage">
        <div class="scroller" id="scroller">
          <div class="transcript" id="transcript" role="region" aria-label="会话记录"></div>
        </div>
        <button type="button" class="jump" id="jump" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="m5.5 12.5 6.5 6.5 6.5-6.5"></path></svg>
          最新
        </button>
      </div>
      <form class="composer" id="composer" autocomplete="off"></form>
    </main>
    <aside class="details" id="details" aria-label="会话详情" hidden></aside>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <p class="visually-hidden" id="live" aria-live="polite"></p>
  <noscript><p class="noscript">这个页面需要启用 JavaScript。</p></noscript>
</body>
</html>

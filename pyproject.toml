[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deskhelm"
version = "0.2.0"
description = "A local-first control surface for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deskhelm = "deskhelm_cli:main"

[project.optional-dependencies]
ptt = [
    "evdev>=1.9.3",
]

[tool.setuptools]
packages = [
  "deskhelm_acp_adapter",
  "deskhelm_claude_adapter",
  "deskhelm_cli",
  "deskhelm_client",
  "deskhelm_codex_adapter",
  "deskhelm_core",
  "deskhelm_dashboard",
  "deskhelm_host",
  "deskhelm_protocol",
  "deskhelm_voice",
  "deskhelm_voice_host",
  "deskhelm_web",
]

[tool.setuptools.package-dir]
deskhelm_acp_adapter = "adapters/acp/deskhelm_acp_adapter"
deskhelm_claude_adapter = "adapters/claude/deskhelm_claude_adapter"
deskhelm_cli = "bridge/deskhelm_cli"
deskhelm_client = "bridge/deskhelm_client"
deskhelm_codex_adapter = "adapters/codex/deskhelm_codex_adapter"
deskhelm_core = "bridge/deskhelm_core"
deskhelm_dashboard = "bridge/deskhelm_dashboard"
deskhelm_host = "bridge/deskhelm_host"
deskhelm_protocol = "bridge/deskhelm_protocol"
deskhelm_voice = "voice/deskhelm_voice"
deskhelm_voice_host = "bridge/deskhelm_voice_host"
deskhelm_web = "bridge/deskhelm_web"

[tool.setuptools.package-data]
deskhelm_web = ["assets/*", "assets/js/*.js", "assets/js/views/*.js"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deskhelm"
version = "0.1.0.dev0"
description = "A local-first control surface for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deskhelm = "deskhelm_bridge.cli:main"
deskhelm-codex-hook = "deskhelm_bridge.codex_hook:main"
agent-io = "deskhelm_bridge.cli:main"
agent-io-codex-hook = "deskhelm_bridge.codex_hook:main"

[tool.setuptools]
packages = ["agent_io_bridge", "deskhelm_bridge", "deskhelm_codex_adapter"]

[tool.setuptools.package-dir]
agent_io_bridge = "bridge/agent_io_bridge"
deskhelm_bridge = "bridge/deskhelm_bridge"
deskhelm_codex_adapter = "adapters/codex/deskhelm_codex_adapter"
